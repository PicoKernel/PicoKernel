name: Build and Release

on:
  pull_request:
    types: [opened, synchronize, reopened]
    paths:
      - "src/**"
      - "include/**"
      - "CMakeLists.txt"
      - ".gitmodules"
      - ".forgejo/workflows/build-and-release.yml"
  push:
    tags:
      - "v*"

concurrency:
  group: ci-${{ github.event.pull_request.number || github.ref }}
  # Only cancel superseded PR builds; never cancel an in-flight release.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  build:
    name: ARM Cross-Compile (RP2350)
    runs-on: codeberg-medium-lazy
    timeout-minutes: 10

    steps:
      - name: Checkout (PR head or tag) with submodules
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
          submodules: recursive
          fetch-depth: 0

      # ---- PR-only: verify the PR merges cleanly, then build the merged tree ----
      - name: Simulate merge into target branch
        if: ${{ github.event_name == 'pull_request' }}
        env:
          BASE_REF: ${{ github.event.pull_request.base.ref }}
        run: |
          echo "Simulating merge of this PR into '$BASE_REF'..."

          git config user.email "picokernel@modprobe.dev"
          git config user.name  "The PicoKernel Project"

          git fetch origin "$BASE_REF":"refs/remotes/origin/$BASE_REF"

          if ! git merge --no-commit --no-ff "origin/$BASE_REF"; then
            echo "::error::This branch does not merge cleanly into '$BASE_REF'. Resolve conflicts locally (git merge origin/$BASE_REF) and push again."
            git merge --abort || true
            exit 1
          fi

          echo "Clean merge into '$BASE_REF' confirmed — building from the merged tree."

      - name: Re-sync submodules against the merged tree
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          git submodule sync --recursive
          git submodule update --init --recursive

      - name: Install ARM toolchain and CMake
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib \
            cmake \
            ninja-build \
            python3

      # ---- PR-only: a placeholder must never end up in a tagged release ----
      - name: Ensure a buildable entry point exists
        if: ${{ github.event_name == 'pull_request' }}
        run: |
          if find src -name 'main.c' 2>/dev/null | grep -q .; then
            echo "main.c found under src/ — using existing entry point."
          else
            echo "No main.c found under src/ — generating a placeholder so the build can be verified."
            mkdir -p src/kernel
            cat > src/kernel/main.c << 'STUB_EOF'
          #include "pico/stdlib.h"

          void main(void) {
              stdio_init_all();
              for (;;) {
                  tight_loop_contents();
              }
          }
          STUB_EOF
          fi

      - name: Configure CMake
        run: |
          cmake -B build \
            -DPICO_BOARD=pico2_w \
            -DKERNEL_DEBUG=OFF

      - name: Build
        run: cmake --build build -j$(nproc)

      # ---- Tag-only: collect firmware outputs for the release job ----
      - name: Collect firmware artifacts
        if: ${{ github.event_name == 'push' }}
        run: |
          set -euo pipefail
          mkdir -p firmware
          # Adjust the patterns/depth to match what your CMake targets emit.
          find build -maxdepth 3 -type f \( -name '*.uf2' -o -name '*.elf' -o -name '*.bin' \) \
            -exec cp -v {} firmware/ \;
          if [ -z "$(ls -A firmware)" ]; then
            echo "::error::Build produced no firmware artifacts to release."
            exit 1
          fi

      - name: Upload firmware
        if: ${{ github.event_name == 'push' }}
        uses: actions/upload-artifact@v3
        with:
          name: firmware
          path: firmware/
          if-no-files-found: error

  release:
    name: Create signed Codeberg release
    needs: build
    if: ${{ github.event_name == 'push' && startsWith(github.ref, 'refs/tags/') }}
    runs-on: codeberg-medium-lazy
    timeout-minutes: 10

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Download firmware from build job
        uses: actions/download-artifact@v3
        with:
          name: firmware
          path: firmware/

      - name: Determine tags
        id: tags
        run: |
          set -euo pipefail
          git fetch --tags --force
          current_tag="${GITHUB_REF_NAME}"
          previous_tag="$(git describe --tags --abbrev=0 "${current_tag}^" 2>/dev/null || true)"
          echo "current_tag=$current_tag" >> "$GITHUB_OUTPUT"
          echo "previous_tag=$previous_tag" >> "$GITHUB_OUTPUT"

      - name: Decide release type
        id: semver
        env:
          TAG: ${{ steps.tags.outputs.current_tag }}
        run: |
          set -euo pipefail
          version="${TAG#v}"
          stage="${version#*-}"
          [ "$stage" = "$version" ] && stage=""
          if echo "$stage" | grep -Eiq '^(alpha|beta|rc)(\.|$)'; then
            echo "prerelease=true" >> "$GITHUB_OUTPUT"
          else
            echo "prerelease=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Changelog
        env:
          PREV: ${{ steps.tags.outputs.previous_tag }}
          CUR: ${{ steps.tags.outputs.current_tag }}
        run: |
          set -euo pipefail
          range="${PREV:+$PREV..}$CUR"
          git log "$range" --pretty=format:"- %s (%h)" --no-merges > changelog.md

      - name: Assemble and sign assets
        env:
          TAG: ${{ steps.tags.outputs.current_tag }}
          GPG_SUBKEY: ${{ secrets.GPG_PRIVATE_KEY }}
          GPG_PASSPHRASE: ${{ secrets.GPG_PASSPHRASE }}
        run: |
          set -euo pipefail
          export GNUPGHOME="$(mktemp -d)"; chmod 700 "$GNUPGHOME"
          trap 'gpgconf --kill gpg-agent; rm -rf "$GNUPGHOME"' EXIT

          echo "$GPG_SUBKEY" | gpg --batch --import
          mkdir dist
          git archive --format=tar.gz --prefix="picokernel-${TAG}/" -o "dist/picokernel-${TAG}.tar.gz" "$TAG"

          # Firmware built once in the build job (loader .uf2/.elf, kernel.bin, ...)
          cp -v firmware/* dist/

          (cd dist && sha256sum * > SHA256SUMS)

          for f in dist/*; do
            gpg --batch --pinentry-mode loopback --passphrase "$GPG_PASSPHRASE" \
                --armor --detach-sign "$f"
          done

      - name: Create release and upload assets
        env:
          RELEASE_TOKEN: ${{ secrets.RELEASE_TOKEN }}
          REPO: ${{ github.repository }}
          TAG: ${{ steps.tags.outputs.current_tag }}
          PRERELEASE: ${{ steps.semver.outputs.prerelease }}
        run: |
          set -euo pipefail
          api="https://codeberg.org/api/v1/repos/${REPO}/releases"

          payload=$(jq -n --arg tag "$TAG" --rawfile body changelog.md \
            --argjson pre "$PRERELEASE" \
            '{tag_name:$tag, name:$tag, body:$body, draft:false, prerelease:$pre}')

          id=$(curl -sSf -X POST -H "Authorization: token ${RELEASE_TOKEN}" \
            -H "Content-Type: application/json" -d "$payload" "$api" | jq -r .id)

          for f in dist/*; do
            curl -sSf -X POST -H "Authorization: token ${RELEASE_TOKEN}" \
              -F "attachment=@${f}" "${api}/${id}/assets?name=$(basename "$f")"
          done
