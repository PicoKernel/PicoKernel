name: Lint Check

on:
  pull_request:
    paths:
      - "src/**"
      - ".clang-format"
      - ".clang-tidy"
      - "cppcheck-suppressions.txt"
      - ".forgejo/workflows/lint.yml"

concurrency:
  group: lint-${{ github.ref }}
  cancel-in-progress: true

jobs:
  clang-format:
    name: clang-format
    runs-on: codeberg-tiny-lazy
    timeout-minutes: 2
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Install clang-format-18
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends clang-format-18

      - name: Check formatting
        run: |
          FILES="$(find src -name '*.c' -o -name '*.h')"
          if [ -z "$FILES" ]; then
            echo "No .c/.h files under src/ or include/ yet — nothing to format-check."
            exit 0
          fi
          echo "$FILES" | xargs clang-format-18 --dry-run --Werror

  spdx-check:
    name: SPDX license header check
    runs-on: codeberg-tiny-lazy
    timeout-minutes: 1
    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Check headers
        run: |
          fail=0
          checked=0
          while IFS= read -r -d '' f; do
            checked=$((checked + 1))
            if ! grep -q "SPDX-License-Identifier: GPL-3.0-or-later" "$f"; then
              echo "MISSING SPDX-License-Identifier: GPL-3.0-or-later  →  $f"
              fail=1
            fi
            if ! grep -q "SPDX-FileCopyrightText: 2025 PicoKernel Contributors" "$f"; then
              echo "MISSING SPDX-FileCopyrightText: 2025 PicoKernel Contributors  →  $f"
              fail=1
            fi
          done < <(find src -name '*.c' -o -name '*.h' -print0)
          echo "Checked $checked file(s)."
          exit $fail

  static-analysis:
    name: clang-tidy + cppcheck
    runs-on: codeberg-medium-lazy
    timeout-minutes: 10
    steps:
      - name: Checkout source (with submodules)
        uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Install toolchain
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends \
            clang-tidy-18 \
            cppcheck \
            cmake \
            ninja-build \
            gcc-arm-none-eabi \
            libnewlib-arm-none-eabi \
            libstdc++-arm-none-eabi-newlib

      - name: Configure build
        run: cmake -B build -G Ninja -DCMAKE_EXPORT_COMPILE_COMMANDS=ON

      - name: Run clang-tidy
        run: |
          FILES="$(find src -name '*.c')"
          if [ -z "$FILES" ]; then
            echo "No .c files under src/ yet — nothing to tidy-check."
            exit 0
          fi

          EXTRA_ARGS=""
          for inc in $(arm-none-eabi-gcc -E -v -xc /dev/null 2>&1 \
              | sed -n '/#include <\.\.\.> search starts here:/,/End of search list/p' \
              | grep '^ ' | sed 's/^ //'); do
            EXTRA_ARGS="$EXTRA_ARGS --extra-arg=-isystem$inc"
          done

          echo "$FILES" | xargs clang-tidy-18 -p build $EXTRA_ARGS

      - name: Run cppcheck
        run: |
          cppcheck \
            --enable=all \
            --error-exitcode=1 \
            --suppressions-list=cppcheck-suppressions.txt \
            --project=build/compile_commands.json \
            --inline-suppr \
            --std=c11 \
            -i"$(pwd)/lib" \
            -i"$(pwd)/build"
